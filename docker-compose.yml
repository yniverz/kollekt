# Für Portainer: Stacks > Add stack > Repository (dieses Repo) oder Web editor.
# Beim ersten Start legt KOLLEKT_ADMIN_USER / KOLLEKT_ADMIN_PASSWORD das Admin-Konto an.
# Ohne diese Variablen erscheint beim ersten Aufruf eine Einrichtungsseite.
services:
  kollekt:
    build: .
    image: kollekt:latest
    container_name: kollekt
    restart: unless-stopped
    ports:
      # Port, unter dem Kollekt auf dem Host erreichbar ist. In Portainer als Environment-Variable KOLLEKT_PORT setzen.
      - "${KOLLEKT_PORT:-8080}:8080"
    environment:
      TZ: Europe/Berlin
      # Hinter einem HTTPS-Proxy wird "Secure" automatisch erkannt (X-Forwarded-Proto).
      # Nur auf "1" setzen, wenn der Proxy diesen Header nicht sendet. Bei reinem HTTP-Zugriff leer lassen,
      # sonst nehmen Browser das Login-Cookie nicht an.
      KOLLEKT_SECURE_COOKIES: ""
      # KOLLEKT_TRUST_PROXY: "1"      # nur hinter eigenem Reverse Proxy (liest die Client-IP aus X-Forwarded-For)
      # KOLLEKT_ADMIN_USER: admin
      # KOLLEKT_ADMIN_PASSWORD: bitte-aendern-mindestens-10-zeichen
    volumes:
      - kollekt-data:/data

volumes:
  kollekt-data:
